# MW pre-commit configuration (R-020), from the Okapi static-site template (v0.11.1).
# Install once per clone: `uvx pre-commit install --install-hooks` (installs pre-commit and commit-msg hooks).
# The Okapi `conventional-commit` hook cannot be used here (Okapi is private, D-001): it is the local pygrep hook below,
# same regex as commits.yml / okapi-gates.yml.
default_install_hook_types: [pre-commit, commit-msg]
minimum_pre_commit_version: "4.4.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # Public repo: private notes, the bridge and CoworkOS never get committed (claude.md rule 7). Also runs in CI.
      - id: no-private-files
        name: no private files (public repository)
        language: fail
        entry: private file, never commit it to this public repository
        files: (?i)(^|/)(claude(\.local)?|memory)\.md$|(^|/)(_bridge|CoworkOS)/
      - id: conventional-commit
        name: conventional commit message
        language: pygrep
        entry: '\A(Merge (branch|pull request|remote-tracking branch|tag) |Revert "|(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: \S)'
        args: [--multiline, --negate]
        stages: [commit-msg]
